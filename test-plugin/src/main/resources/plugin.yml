name: BDApiTest
version: '${version}'
main: fr.redsavant.Main
api-version: '1.21'
commands:
  bdtest:
    description: Runs the BDApi feature tests
    usage: /bdtest <all|display|paper|packet|packetprivate|offset|blockdata|parity|animation|timeline|group|physics|effects|clear>
    permission: bdapi.test
permissions:
  bdapi.test:
    default: op
